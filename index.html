<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#f9f9f6"/><meta name="description" content="RASULOVA ART. Авторские вазы, декоративные блюда и объекты с характером. Рассмотрите работы и соберите свою маленькую выставку."/><title>RASULOVA ART | Объекты с характером</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><script>
// Reload starts at the hero; anchor links and history navigation keep their targets.
(()=>{
 const navigation=performance.getEntriesByType('navigation')[0];
 if(navigation?.type!=='reload'||location.hash)return;
 history.scrollRestoration='manual';
 const reset=()=>window.scrollTo({top:0,left:0,behavior:'instant'});
 reset();
 window.addEventListener('pageshow',reset,{once:true});
 window.addEventListener('pagehide',()=>{history.scrollRestoration='auto'},{once:true});
})();
</script><style>
#startup-loader{position:fixed;inset:0;z-index:9999;background:#f9f9f6;display:grid;place-items:center;transition:opacity .25s}
#startup-loader.is-ready{opacity:0;pointer-events:none}
.spinner{font-size:28px;position:relative;display:inline-block;width:1em;height:1em}
.spinner-blade{position:absolute;left:.4629em;bottom:0;width:.074em;height:.2777em;border-radius:.0555em;background:transparent;transform-origin:center -.2222em;animation:spinner-fade9234 1s infinite linear;transform:rotate(calc(var(--i)*30deg));animation-delay:calc(var(--i)*.083s)}
@keyframes spinner-fade9234{0%{background-color:#69717d}100%{background-color:transparent}}
@media(prefers-reduced-motion:reduce){.spinner-blade{animation:none;background:#69717d;opacity:.45}#startup-loader{transition:none}}
</style></head><body><div id="startup-loader" role="status" aria-label="&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1082;&#1072; / Loading"><!-- Spinner design: Uiverse.io by mrhyddenn --><div class="spinner" aria-hidden="true"><div class="spinner-blade" style="--i:0"></div><div class="spinner-blade" style="--i:1"></div><div class="spinner-blade" style="--i:2"></div><div class="spinner-blade" style="--i:3"></div><div class="spinner-blade" style="--i:4"></div><div class="spinner-blade" style="--i:5"></div><div class="spinner-blade" style="--i:6"></div><div class="spinner-blade" style="--i:7"></div><div class="spinner-blade" style="--i:8"></div><div class="spinner-blade" style="--i:9"></div><div class="spinner-blade" style="--i:10"></div><div class="spinner-blade" style="--i:11"></div></div></div><script>
(()=>{
 const loader=document.getElementById('startup-loader');let done=false,timer;
 function finish(){if(done)return;done=true;clearTimeout(timer);window.removeEventListener('hero-ready',ready);loader.classList.add('is-ready');setTimeout(()=>{loader.remove();document.documentElement.dataset.siteReady='true';window.dispatchEvent(new Event('site-ready'))},300)}
 function ready(){Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,1500))]).then(finish)}
 window.addEventListener('hero-ready',ready,{once:true});timer=setTimeout(finish,12000);
 window.addEventListener('load',()=>{const poster=document.querySelector('.film-poster');if(matchMedia('(prefers-reduced-motion: reduce)').matches&&poster){if(poster.complete)ready();else{poster.addEventListener('load',ready,{once:true});poster.addEventListener('error',ready,{once:true})}}},{once:true});
})();
</script><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
